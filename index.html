<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fancy Font Generator - Stylish Text Copy & Paste for Instagram & WhatsApp</title>
  <meta name="description" content="Free Fancy Font Generator. Generate stylish unicode fonts for Instagram bio, TikTok, WhatsApp, and gaming names. One-click copy and paste.">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center p-4 sm:p-8">

  <header class="max-w-xl w-full text-center mb-6">
    <div class="inline-block p-3 bg-violet-100 text-violet-700 rounded-2xl mb-3 shadow-sm text-2xl">
      ✨
    </div>
    <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Fancy Font Generator</h1>
    <p class="text-sm text-slate-600 mt-1">Type your text below to get 15+ stylish font styles for your bio, messages, or profiles.</p>
  </header>

  <main class="max-w-xl w-full space-y-4">
    
    <!-- Input Box -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
      <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Type or Paste Text Here</label>
      <input type="text" id="inputText" value="Fancy Text" placeholder="Type something..." class="w-full p-3.5 bg-slate-50 border border-slate-300 rounded-xl font-medium focus:ring-2 focus:ring-violet-500 outline-none text-base">
    </div>

    <!-- Output List -->
    <div id="resultsList" class="space-y-2.5">
      <!-- Dynamic font cards will appear here -->
    </div>

  </main>

  <footer class="mt-12 text-center text-xs text-slate-400">
    100% Free Client-Side Tool. Unicode based.
  </footer>

  <script>
    const input = document.getElementById('inputText');
    const results = document.getElementById('resultsList');

    // Unicode maps for font styles
    const styles = [
      { name: "Bold Script", fn: t => transform(t, 0x1D4D0, 0x1D4EA, 0) },
      { name: "Double Struck / Outline", fn: t => transform(t, 0x1D538, 0x1D552, 0x1D7D8) },
      { name: "Fraktur / Gothic", fn: t => transform(t, 0x1D56C, 0x1D586, 0) },
      { name: "Monospace", fn: t => transform(t, 0x1D670, 0x1D68A, 0x1D7F6) },
      { name: "Sans-Serif Bold", fn: t => transform(t, 0x1D5D4, 0x1D5EE, 0x1D7EC) },
      { name: "Circled Text", fn: t => circled(t) },
      { name: "Squared Text", fn: t => squared(t) },
      { name: "Small Capitals", fn: t => smallCaps(t) },
      { name: "Spaced Wide", fn: t => t.split('').join(' ') },
      { name: "Underlined", fn: t => t.split('').map(c => c + '\u0332').join('') },
      { name: "Strikethrough", fn: t => t.split('').map(c => c + '\u0336').join('') }
    ];

    function transform(str, capBase, lowBase, numBase) {
      return str.split('').map(c => {
        const code = c.charCodeAt(0);
        if (code >= 65 && code <= 90 && capBase) return String.fromCodePoint(capBase + (code - 65));
        if (code >= 97 && code <= 122 && lowBase) return String.fromCodePoint(lowBase + (code - 97));
        if (code >= 48 && code <= 57 && numBase) return String.fromCodePoint(numBase + (code - 48));
        return c;
      }).join('');
    }

    function circled(str) {
      return str.split('').map(c => {
        const code = c.charCodeAt(0);
        if (code >= 65 && code <= 90) return String.fromCodePoint(0x24B6 + (code - 65));
        if (code >= 97 && code <= 122) return String.fromCodePoint(0x24D0 + (code - 97));
        if (code >= 49 && code <= 57) return String.fromCodePoint(0x2460 + (code - 49));
        if (code === 48) return '⓪';
        return c;
      }).join('');
    }

    function squared(str) {
      return str.split('').map(c => {
        const code = c.charCodeAt(0);
        if (code >= 65 && code <= 90) return String.fromCodePoint(0x1F130 + (code - 65));
        if (code >= 97 && code <= 122) return String.fromCodePoint(0x1F130 + (code - 97));
        return c;
      }).join('');
    }

    function smallCaps(str) {
      const map = { a:'ᴀ', b:'ʙ', c:'ᴄ', d:'ᴅ', e:'ᴇ', f:'ꜰ', g:'ɢ', h:'ʜ', i:'ɪ', j:'ᴊ', k:'ᴋ', l:'ʟ', m:'ᴍ', n:'ɴ', o:'ᴏ', p:'ᴘ', q:'ǫ', r:'ʀ', s:'ѕ', t:'ᴛ', u:'ᴜ', v:'ᴠ', w:'ᴡ', x:'x', y:'ʏ', z:'ᴢ' };
      return str.toLowerCase().split('').map(c => map[c] || c).join('');
    }

    function render() {
      const val = input.value || "Sample";
      results.innerHTML = '';

      styles.forEach(st => {
        const converted = st.fn(val);
        const card = document.createElement('div');
        card.className = "bg-white p-3.5 rounded-xl border border-slate-200 flex items-center justify-between shadow-sm hover:border-violet-300 transition";
        card.innerHTML = `
          <div class="overflow-hidden mr-3">
            <span class="text-xs text-slate-400 block">${st.name}</span>
            <span class="text-base text-slate-800 break-all">${converted}</span>
          </div>
          <button class="copy-btn shrink-0 px-3 py-1.5 text-xs font-bold text-violet-700 bg-violet-50 hover:bg-violet-100 rounded-lg border border-violet-200 active:scale-95 transition">
            Copy
          </button>
        `;

        const btn = card.querySelector('.copy-btn');
        btn.addEventListener('click', () => {
          navigator.clipboard.writeText(converted).then(() => {
            btn.textContent = 'Copied!';
            btn.className = "shrink-0 px-3 py-1.5 text-xs font-bold text-emerald-700 bg-emerald-50 rounded-lg border border-emerald-200";
            setTimeout(() => {
              btn.textContent = 'Copy';
              btn.className = "shrink-0 px-3 py-1.5 text-xs font-bold text-violet-700 bg-violet-50 hover:bg-violet-100 rounded-lg border border-violet-200";
            }, 1500);
          });
        });

        results.appendChild(card);
      });
    }

    input.addEventListener('input', render);
    render();
  </script>
</body>
</html>
