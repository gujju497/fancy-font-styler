      return str.split('').map(c => {

        if (code >= 97 && code <= 122 && lowBase) return String.fromCodePoint(lowBase + (code - 97));

        return c;
      }).join('');

    function renderAll() {
      const val = input.value.trim() || "Rahul";
      results.innerHTML = '';

      let allOutputs = [];

      // 1. Core styles
      coreFonts.forEach(cf => {
        allOutputs.push({ label: cf.name, text: cf.fn(val) });
      });

      // 2. Hindi Look with Frames
      const hindiVal = mapReplace(val, devanagariMap);
      frames.slice(0, 40).forEach((fr, idx) => {
        allOutputs.push({ label: `Hindi Bio Style #${idx + 1}`, text: fr(hindiVal) });
      });

      // 3. Small Caps with Frames
      const smallCapsVal = mapReplace(val, smallCapsMap);
      frames.slice(40, 90).forEach((fr, idx) => {
        allOutputs.push({ label: `Small Caps Aesthetic #${idx + 1}`, text: fr(smallCapsVal) });
      });

      // 4. Cursive with Frames
      const cursiveVal = unicodeShift(val, 0x1D4D0, 0x1D4EA, 0);
      frames.slice(90, 140).forEach((fr, idx) => {
        allOutputs.push({ label: `Cursive Wing Style #${idx + 1}`, text: fr(cursiveVal) });
      });

      // 5. Normal text with gaming frames & kaomoji
      frames.slice(140).forEach((fr, idx) => {

      });

      // Update badge count
      countBadge.textContent = `${allOutputs.length} Styles Generated`;

            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">#${index + 1} ${item.label}</span>
            <span class="text-sm sm:text-base text-slate-900 break-all font-medium select-all">${item.text}</span>

            Copy
          </button>
        `;

        const btn = card.querySelector('.copy-btn');
        btn.addEventListener('click', () => {
          navigator.clipboard.writeText(item.text).then(() => {
            btn.textContent = 'Copied!';
            btn.className = "shrink-0 px-3 py-1.5 text-xs font-bold text-emerald-700 bg-emerald-50 rounded-lg border border-emerald-200";

            setTimeout(() => {
              btn.textContent = 'Copy';
              btn.className = "shrink-0 px-3 py-1.5 text-xs font-bold text-violet-700 bg-violet-50 hover:bg-violet-100 rounded-lg border border-violet-200";
            }, 1200);
          });
        });

        fragment.appendChild(card);
      });

      results.appendChild(fragment);
    }

    input.addEventListener('input', renderAll);
    renderAll();
  </script>
</body>
</html>
